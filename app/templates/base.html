<!doctype html>
<html lang="de" data-theme="maintenance">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Maintenance Assistant{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b7cff'/%3E%3Ctext x='32' y='39' text-anchor='middle' font-family='Arial,sans-serif' font-size='22' font-weight='800' fill='white'%3EMA%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}?v=20260521-task-priority1">
  </head>
  <body class="app-body min-h-screen text-slate-900 antialiased">
    <a class="skip-link" href="#main-content">Zum Hauptinhalt springen</a>
    <div id="maintenance-shell-icons-root"></div>
    <div class="app-shell-layout min-h-screen lg:grid lg:grid-cols-[var(--sidebar-width)_minmax(0,1fr)]">
      <div id="maintenance-shell-sidebar-root" hidden></div>
      <div class="app-content min-w-0">
        <div id="maintenance-shell-topbar-root" hidden data-shell-title="{% block header_title %}Maintenance Assistant{% endblock %}"></div>
        <main class="app-main" id="main-content" tabindex="-1">
          <div class="sr-only" aria-live="polite" aria-atomic="true" data-global-live-region></div>
          {% block content %}{% endblock %}
        </main>
      </div>
    </div>

    <div id="maintenance-shell-chat-root" hidden></div>

    <script src="{{ url_for('static', filename='core/feature-registry.js') }}?v=20260521-task-priority1"></script>
    <script src="{{ url_for('static', filename='core/action-dialogs.js') }}?v=20260521-task-priority1"></script>
    <script src="{{ url_for('static', filename='auth.js') }}?v=20260521-task-priority1"></script>
    <script src="{{ url_for('static', filename='core/api-client.js') }}?v=20260511-api-client1"></script>
    <script src="{{ url_for('static', filename='app.js') }}?v=20260521-task-priority1"></script>
    {{ react_entrypoint("src/layout/shellChromeEntrypoint.tsx") }}
  </body>
</html>
