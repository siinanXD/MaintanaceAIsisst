[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "node_modules",
    "data",
    "documents",
    "logs",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "D",
    "B",
    "UP",
]
ignore = [
    "D203",
    "D212",
    "D213",
]

[tool.coverage.run]
omit = [
    "app/demo_data.py",
    "app/errors/services.py",
    "app/tasks/services.py",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
norecursedirs = [
    ".codex_tmp",
    ".git",
    ".venv",
    "backend",
    "data",
    "documents",
    "logs",
    "manuals",
    "node_modules",
    "tmp",
]
